name: Validate and Deploy Website

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate website files
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify website structure
        run: ./scripts/verify.sh

      - name: Check expected page content
        run: grep -q "Deployment successful." website/index.html

  deploy:
    name: Deploy website to S3
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::256748319015:role/GitHubActionsS3DeployRole
          aws-region: us-east-1

      - name: Deploy website to S3
        run: aws s3 sync website/ s3://olaoluuadebayo-github-actions-cicd-256748319015/ --delete
